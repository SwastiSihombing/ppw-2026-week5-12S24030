openapi: 3.0.3
info:
  title: SIPUS-Del RESTful Web API
  version: 1.0.0
  description: >
    Kontrak resmi REST API Sistem Informasi Perpustakaan Kampus IT Del (Tahap 3).
    Seluruh galat berformat RFC 7807 (application/problem+json), dan setiap resource
    memuat tautan hypermedia `_links` (Richardson Maturity Model Level 3).
    Layanan SOAP bebas pustaka memiliki kontrak terpisah pada GET /soap/sipus.wsdl.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server
tags:
  - name: Auth
  - name: Kategori
  - name: Buku
  - name: Peminjaman

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token hasil POST /auth/login

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }

  schemas:
    Link:
      type: object
      required: [href, method]
      properties:
        href: { type: string, format: uri }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }

    Kategori:
      type: object
      properties:
        id: { type: integer, example: 1 }
        kode_kategori: { type: string, example: KAT001 }
        nama_kategori: { type: string, example: Teknologi Informasi }
        deskripsi: { type: string, nullable: true }
        jumlah_buku: { type: integer }
        _links:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Link' }

    BukuInput:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, stok, kategori_id]
      properties:
        isbn: { type: string, maxLength: 20, description: Harus unik, example: '9786020000001' }
        judul: { type: string, maxLength: 200, example: Pemrograman Web Lanjut }
        penulis: { type: string, maxLength: 150, example: Chandro Pardede }
        penerbit: { type: string, maxLength: 150, example: Del Press }
        tahun_terbit: { type: integer, minimum: 1900, example: 2024 }
        stok: { type: integer, minimum: 0, example: 5 }
        sinopsis: { type: string, nullable: true }
        kategori_id: { type: integer, description: Harus ada di tabel kategoris, example: 1 }

    BukuPatch:
      type: object
      minProperties: 1
      description: Minimal satu atribut. Atribut yang tidak dikirim tidak berubah.
      properties:
        isbn: { type: string, maxLength: 20 }
        judul: { type: string, maxLength: 200 }
        penulis: { type: string, maxLength: 150 }
        penerbit: { type: string, maxLength: 150 }
        tahun_terbit: { type: integer, minimum: 1900 }
        stok: { type: integer, minimum: 0, example: 10 }
        sinopsis: { type: string, nullable: true }
        kategori_id: { type: integer }

    Buku:
      type: object
      properties:
        id: { type: integer, example: 1 }
        isbn: { type: string }
        judul: { type: string }
        penulis: { type: string }
        penerbit: { type: string }
        tahun_terbit: { type: integer }
        stok: { type: integer }
        status_ketersediaan: { type: string, enum: [TERSEDIA, HABIS] }
        sinopsis: { type: string, nullable: true }
        kategori: { $ref: '#/components/schemas/Kategori' }
        jumlah_peminjaman: { type: integer }
        riwayat_peminjaman:
          type: array
          description: Hanya pada detail buku. NIM dan nama disamarkan tanpa Bearer Token.
          items: { $ref: '#/components/schemas/Peminjaman' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _links:
          type: object
          description: Tautan pinjam_buku hanya muncul jika stok > 0.
          additionalProperties: { $ref: '#/components/schemas/Link' }

    PeminjamanInput:
      type: object
      required: [buku_id, nim_peminjam, nama_peminjam, durasi_hari]
      properties:
        buku_id: { type: integer, example: 1 }
        nim_peminjam: { type: string, maxLength: 20, example: 12S24030 }
        nama_peminjam: { type: string, maxLength: 150, example: Swasti Maristella Sihombing }
        durasi_hari: { type: integer, minimum: 1, maximum: 30, example: 7 }

    Peminjaman:
      type: object
      properties:
        id: { type: integer }
        kode_pinjam: { type: string, example: PJM-A1B2C3D4 }
        nim_peminjam: { type: string }
        nama_peminjam: { type: string }
        tanggal_pinjam: { type: string, format: date }
        tanggal_jatuh_tempo: { type: string, format: date }
        tanggal_kembali: { type: string, format: date, nullable: true }
        status: { type: string, enum: [dipinjam, dikembalikan] }
        buku:
          type: object
          properties:
            id: { type: integer }
            isbn: { type: string }
            judul: { type: string }
            stok: { type: integer }
        _links:
          type: object
          description: Tautan kembalikan_buku hanya muncul jika status = dipinjam.
          additionalProperties: { $ref: '#/components/schemas/Link' }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
        links:
          type: object
          properties:
            first: { type: string, format: uri }
            prev: { type: string, format: uri, nullable: true }
            next: { type: string, format: uri, nullable: true }
            last: { type: string, format: uri }

    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri, example: 'http://localhost:8000/docs/errors/validation-failed' }
        title: { type: string, example: Unprocessable Content }
        status: { type: integer, example: 422 }
        detail: { type: string }
        instance: { type: string, example: /api/v1/bukus }
        errors:
          type: object
          description: Rincian per kolom (galat 422).
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    BadRequest:
      description: Permintaan tidak bermakna (PATCH tanpa atribut)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Bearer Token tidak ada, salah, atau sudah dicabut
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Konflik dengan kondisi data saat ini
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unprocessable:
      description: Gagal validasi input atau aturan bisnis
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Menerbitkan Bearer Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: pustakawan@del.ac.id }
                password: { type: string, example: password123 }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      token_type: { type: string, example: Bearer }
                      access_token: { type: string }
                      user:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          email: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pemilik token
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Profil berhasil diambil }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Mencabut token yang sedang dipakai
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Token dicabut }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /kategoris:
    get:
      tags: [Kategori]
      summary: Daftar kategori
      responses:
        '200':
          description: Koleksi kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Kategori' }

  /kategoris/{id}:
    get:
      tags: [Kategori]
      summary: Detail kategori
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Kategori ditemukan }
        '404': { $ref: '#/components/responses/NotFound' }

  /bukus:
    get:
      tags: [Buku]
      summary: Koleksi buku terpaginasi
      parameters:
        - { name: search, in: query, description: 'Judul, penulis, atau ISBN', schema: { type: string } }
        - { name: kategori_id, in: query, schema: { type: integer } }
        - { name: tersedia, in: query, description: 'Isi 1 untuk stok > 0', schema: { type: integer, enum: [0, 1] } }
        - { name: sort, in: query, schema: { type: string, enum: [judul, penulis, tahun_terbit, stok, created_at], default: judul } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Koleksi buku beserta blok meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Buku' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [Buku]
      summary: Menambah buku baru
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuInput' }
      responses:
        '201':
          description: Buku berhasil dibuat
          headers:
            Location:
              description: URL buku baru
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Buku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /bukus/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Buku]
      summary: Detail buku beserta kategori dan riwayat peminjaman
      responses:
        '200': { description: Buku ditemukan }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Buku]
      summary: Mengganti seluruh atribut buku (sinopsis yang tidak dikirim direset ke null)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuInput' }
      responses:
        '200': { description: Seluruh atribut diganti }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    patch:
      tags: [Buku]
      summary: Mengubah sebagian atribut buku
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuPatch' }
      responses:
        '200': { description: Atribut yang dikirim diperbarui }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Buku]
      summary: Menghapus buku (ditolak jika masih ada peminjaman aktif)
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Berhasil dihapus tanpa body }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bukus/{id}/referensi-eksternal:
    get:
      tags: [Buku]
      summary: Metadata tambahan dari OpenLibrary (timeout 8 detik, dengan fallback data lokal)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Selalu berisi data lokal. Status sumber menjelaskan hasil pemanggilan OpenLibrary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      buku: { type: object }
                      sumber:
                        type: object
                        properties:
                          penyedia: { type: string, example: OpenLibrary }
                          status: { type: string, enum: [ditemukan, tidak_ditemukan, tidak_terjangkau, gangguan_layanan] }
                      referensi_eksternal:
                        type: object
                        nullable: true
                        properties:
                          judul: { type: string, nullable: true }
                          penulis: { type: array, items: { type: string } }
                          penerbit: { type: array, items: { type: string } }
                          jumlah_halaman: { type: integer, nullable: true }
                          tanggal_terbit: { type: string, nullable: true }
                          sampul_url: { type: string, nullable: true }
                          halaman_url: { type: string, nullable: true }
                          pratinjau_url: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /peminjamans:
    get:
      tags: [Peminjaman]
      summary: Daftar transaksi terpaginasi
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [dipinjam, dikembalikan] } }
        - { name: nim, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Koleksi transaksi beserta blok meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Peminjaman' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [Peminjaman]
      summary: Mencatat peminjaman (DB::transaction + lockForUpdate)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeminjamanInput' }
      responses:
        '201':
          description: Peminjaman tercatat dan stok berkurang satu
          headers:
            Location:
              description: URL transaksi baru
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Peminjaman' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /peminjamans/{id}:
    get:
      tags: [Peminjaman]
      summary: Detail transaksi
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Transaksi ditemukan }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /peminjamans/{id}/kembalikan:
    patch:
      tags: [Peminjaman]
      summary: Mengembalikan buku (DB::transaction + lockForUpdate)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Status dikembalikan dan stok bertambah satu }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
